<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Profit Calculator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="app">

    <div class="card">

        <div class="header">
            <h1><i class="fa-solid fa-chart-line"></i> Profit Dashboard</h1>
            <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-money-bill"></i> Income</label>
            <input type="number" id="income" placeholder="Enter income">
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-receipt"></i> Expenses</label>
            <input type="number" id="expense" placeholder="Enter expenses">
        </div>

        <button class="calc-btn" onclick="calculate()">
            <i class="fa-solid fa-calculator"></i> Calculate
        </button>

        <div class="loader" id="loader"></div>

        <div class="result" id="result"></div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
