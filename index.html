<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Profit Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💰 Smart Profit Calculator</h1>

    <div class="input-group">
        <label>Income</label>
        <input type="number" id="income" placeholder="Enter income">
    </div>

    <div class="input-group">
        <label>Expenses</label>
        <input type="number" id="expense" placeholder="Enter expenses">
    </div>

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result"></div>
</div>

<script src="script.js"></script>
</body>
</html>
