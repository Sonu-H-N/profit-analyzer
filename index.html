<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Profit Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <div class="card">

        <h1>💰 Profit Dashboard</h1>
        <p class="subtitle">Income vs Expense Analyzer</p>

        <div class="input-group">
            <label>Income</label>
            <input type="number" id="income" placeholder="Enter total income">
        </div>

        <div class="input-group">
            <label>Expenses</label>
            <input type="number" id="expense" placeholder="Enter total expenses">
        </div>

        <button onclick="calculate()">Calculate Profit</button>

        <div class="result" id="result">
            Results will appear here...
        </div>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
