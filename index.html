<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profit Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div class="app">

    <div class="card">

        <div class="header">
            <h1><i class="fa-solid fa-chart-line"></i> Profit Dashboard</h1>
            <button id="themeToggle"><i class="fa-solid fa-moon"></i></button>
        </div>
         <div class="summary">

    <div class="card-box income">
        <h3>Total Income</h3>
        <p id="totalIncome">₹0</p>
    </div>

    <div class="card-box expense">
        <h3>Total Expense</h3>
        <p id="totalExpense">₹0</p>
    </div>

    <div class="card-box profit">
        <h3>Total Profit</h3>
        <p id="totalProfit">₹0</p>
    </div>

    <div class="card-box avg">
        <h3>Avg Profit</h3>
        <p id="avgProfit">₹0</p>
    </div>

</div>
        <div class="input-group">
            <label>Income</label>
            <input type="number" id="income" placeholder="Enter income">
        </div>

        <div class="input-group">
            <label>Expenses</label>
            <input type="number" id="expense" placeholder="Enter expenses">
        </div>

        <button class="calc-btn" onclick="calculate()">Calculate</button>

        <div class="loader" id="loader"></div>

        <div class="result" id="result"></div>

        <!-- Chart -->
        <canvas id="profitChart"></canvas>
        <h2>📜 History</h2>

<table id="historyTable">
    <h2>📈 Monthly Profit Trend</h2>
<canvas id="monthlyChart"></canvas>
    <thead>
        <tr>
            <th>Date</th>
            <th>Income</th>
            <th>Expense</th>
            <th>Profit</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</body>
</html>
